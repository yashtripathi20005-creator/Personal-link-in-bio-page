<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="My personal link-in-bio page"
    >

    <title>{{ profile.name }} | Links</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <main class="page">

        <!-- Profile -->
        <section class="profile">

            <div class="profile-image-wrapper">
                <img
                    class="profile-image"
                    src="{{ url_for('static', filename=profile.profile_image) }}"
                    alt="{{ profile.name }}"
                >
            </div>

            <h1>{{ profile.name }}</h1>

            <p class="username">
                {{ profile.username }}
            </p>

            <p class="bio">
                {{ profile.bio }}
            </p>

        </section>


        <!-- Links -->
        <section class="links">

            {% for link in links %}

            <a
                class="link-card"
                href="{{ link.url }}"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="link-icon">
                    {{ link.icon }}
                </span>

                <span class="link-title">
                    {{ link.title }}
                </span>

                <span class="link-arrow">
                    →
                </span>

            </a>

            {% endfor %}

        </section>


        <!-- Social Media -->
        <section class="social-section">

            <div class="social-links">

                {% for social in social_links %}

                <a
                    class="social-link"
                    href="{{ social.url }}"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="{{ social.name }}"
                    title="{{ social.name }}"
                >
                    {{ social.icon }}
                </a>

                {% endfor %}

            </div>

        </section>


        <!-- Footer -->
        <footer>
            <p>
                © <span id="year"></span>
                {{ profile.name }}
            </p>
        </footer>

    </main>


    <script>
        document.getElementById("year").textContent =
            new Date().getFullYear();
    </script>

</body>
</html>
